# ==============================================================================
# WORKFLOW: DIAGNOSE AZURE CONTAINER APPS
# 
# DESCRIPTION:
# Cung cấp công cụ chẩn đoán từ xa (Remote Diagnostics & Troubleshooting) 
# cho phép kỹ sư hệ thống trích xuất Telemetry Data trực tiếp từ môi trường Cloud.
# Việc này loại bỏ nhu cầu truy cập thủ công vào Azure Portal để dò tìm lỗi.
#
# INPUT PARAMETERS:
# - service: Chỉ định định danh của Microservice cần phân tích.
# - lines: Chỉ định số lượng dòng Log gần nhất (Tail Logs) cần truy xuất.
#
# DIAGNOSTIC WORKFLOW:
# 1. TRÍCH XUẤT THÔNG TIN PHIÊN BẢN (REVISION PROFILING):
#    - Truy vấn Azure CLI (az containerapp revision list) để giám sát:
#      * Trạng thái định tuyến luồng (Traffic Weight).
#      * Sức khỏe hệ thống (Health State: Healthy/Unhealthy).
#      * Trạng thái vòng đời hiện tại (Running State).
#
# 2. XUẤT NHẬT KÝ THỰC THI CHUẨN (STDOUT/STDERR):
#    - Gọi lệnh (az containerapp logs show) nhằm thu thập output của container 
#      giống với ngữ cảnh giám sát trên localhost.
#
# 3. PHÂN TÍCH NHẬT KÝ HỆ THỐNG (LOG ANALYTICS KQL QUERY):
#    - Kết nối vào Log Analytics Workspace của Azure.
#    - Thực thi ngôn ngữ truy vấn KQL để tự động sàng lọc các sự kiện nghiêm trọng 
#      thuộc cấp độ hệ thống như: Container Crash, Lỗi bộ nhớ (Out of Memory - OOM), 
#      và Tiến trình bị hủy ép buộc (Killed).
# ==============================================================================
name: Diagnose Azure Container Apps

on:
  workflow_dispatch:
    inputs:
      service:
        description: Container App to inspect, or all
        required: true
        type: choice
        default: all
        options:
          - all
          - gateway-service
          - user-service
          - product-service
          - order-service
          - notification-service
      lines:
        description: Log lines per app
        required: true
        default: "120"

jobs:
  logs:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Collect Container Apps logs
        shell: pwsh
        run: |
          $resourceGroup = "${{ vars.AZURE_RESOURCE_GROUP }}"
          $LogAnalyticsWorkspace = "${{ vars.AZURE_LOG_ANALYTICS_WORKSPACE }}"
          $requestedService = "${{ github.event.inputs.service }}"
          $lines = [int]"${{ github.event.inputs.lines }}"
          $allServices = @(
            "gateway-service",
            "user-service",
            "product-service",
            "order-service",
            "notification-service"
          )

          if ($requestedService -eq "all") {
            $services = $allServices
          } else {
            $services = @($requestedService)
          }

          az extension add --name containerapp --upgrade --only-show-errors

          foreach ($service in $services) {
            Write-Host ""
            Write-Host "============================================================"
            Write-Host "Container App: $service"
            Write-Host "============================================================"

            Write-Host ""
            Write-Host "Revision status:"
            az containerapp revision list `
              --name $service `
              --resource-group $resourceGroup `
              --query "[].{name:name,active:properties.active,traffic:properties.trafficWeight,created:properties.createdTime,replicas:properties.replicas,health:properties.healthState,running:properties.runningState}" `
              -o table

            Write-Host ""
            Write-Host "Recent logs:"
            az containerapp logs show `
              --name $service `
              --resource-group $resourceGroup `
              --tail $lines `
              --only-show-errors

            Write-Host ""
            Write-Host "System Logs (Errors/Warnings):"
            $query = "ContainerAppSystemLogs_CL | where ContainerAppName_s == '$service' | where Log_s contains 'failed' or Log_s contains 'error' or Log_s contains 'OOM' or Log_s contains 'killed' | project TimeGenerated, Log_s, Reason_s | order by TimeGenerated desc | limit 20"
            $workspaceId = az monitor log-analytics workspace show --resource-group $resourceGroup --workspace-name $LogAnalyticsWorkspace --query customerId -o tsv
            if ($workspaceId) {
                az monitor log-analytics query -w $workspaceId --analytics-query $query -o table
            } else {
                Write-Host "Could not find Log Analytics workspace to query system logs."
            }
          }
