# ==============================================================================
# WORKFLOW: PROVISION AZURE INFRASTRUCTURE (IaC)
# 
# DESCRIPTION:
# Kịch bản tự động hóa cấp phát hạ tầng điện toán đám mây (Infrastructure as Code).
# Thiết lập toàn bộ hệ sinh thái dịch vụ nền tảng trên Microsoft Azure cho ứng dụng
# Microservices, bao gồm: Azure Container Apps Environment, Container Registry, 
# Log Analytics Workspace, và nền tảng cơ sở dữ liệu PostgreSQL Flexible Server.
#
# TRIGGERS:
# - workflow_dispatch: Yêu cầu kích hoạt thủ công, nhằm đảm bảo quy trình thay đổi 
#   kiến trúc hạ tầng đám mây phải được kiểm soát nghiêm ngặt bởi người có thẩm quyền, 
#   ngăn ngừa các gián đoạn không mong muốn đối với môi trường đang vận hành.
#
# ARCHITECTURE & EXECUTION PIPELINE:
# 1. AZURE AUTHENTICATION: 
#    - Dùng thông tin định danh cấp phát cho Service Principal (từ GitHub Secrets) 
#      để xác thực và ủy quyền trên nền tảng Azure.
# 2. CONFIGURATION GENERATION: 
#    - Đọc các biến số môi trường (Variables) theo ngữ cảnh 'dev'.
#    - Tự động sinh tệp cấu hình trung gian (env.ps1) theo định dạng PowerShell.
# 3. RESOURCE PROVISIONING: 
#    - Kích hoạt module PowerShell cốt lõi (create-infra.ps1). Script này sẽ phân giải 
#      các lệnh Azure CLI (hoặc Bicep/ARM Templates) nhằm xây dựng kiến trúc tài nguyên 
#      theo cấu hình đã định nghĩa.
# ==============================================================================
name: Provision Azure Infrastructure

on:
  workflow_dispatch:

concurrency:
  group: azure-infra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Generate Azure env config
        shell: pwsh
        run: |
          @"
          `$ProjectName = "${{ vars.PROJECT_NAME }}"
          `$EnvironmentName = "${{ vars.ENVIRONMENT_NAME }}"
          `$Location = "${{ vars.AZURE_LOCATION }}"
          `$ResourceGroup = "${{ vars.AZURE_RESOURCE_GROUP }}"
          `$ContainerAppsEnv = "${{ vars.AZURE_CONTAINER_APPS_ENV }}"
          `$LogAnalyticsWorkspace = "${{ vars.AZURE_LOG_ANALYTICS_WORKSPACE }}"
          `$UserAssignedIdentity = "${{ vars.AZURE_USER_ASSIGNED_IDENTITY }}"
          `$AcrName = "${{ vars.AZURE_CONTAINER_REGISTRY }}"
          `$PostgresServerName = "${{ vars.AZURE_POSTGRES_SERVER }}"
          `$PostgresAdminUser = "${{ vars.AZURE_POSTGRES_ADMIN_USER }}"
          `$PostgresAdminPassword = "${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}"
          `$PostgresSku = "${{ vars.AZURE_POSTGRES_SKU }}"
          `$PostgresTier = "${{ vars.AZURE_POSTGRES_TIER }}"
          `$PostgresVersion = "${{ vars.AZURE_POSTGRES_VERSION }}"
          `$ImageTag = "infra"
          `$Services = @("user-service", "product-service", "notification-service", "order-service", "gateway-service")
          "@ | Set-Content -Path infra/azure/env.ps1 -Encoding UTF8

      - name: Create or update Azure infrastructure
        shell: pwsh
        run: ./infra/azure/create-infra.ps1
