services:
  postgres:
    image: postgres:16-alpine
    container_name: mscloud-postgres
    environment:
      POSTGRES_USER: mscloud
      POSTGRES_PASSWORD: mscloud
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mscloud -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway-service:
    build: ./services/gateway-service
    container_name: gateway-service
    environment:
      SERVER_PORT: 8080
      USER_SERVICE_URL: http://user-service:8080
      PRODUCT_SERVICE_URL: http://product-service:8080
      ORDER_SERVICE_URL: http://order-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - product-service
      - order-service
      - notification-service

  user-service:
    build: ./services/user-service
    container_name: user-service
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      SPRING_DATASOURCE_USERNAME: mscloud
      SPRING_DATASOURCE_PASSWORD: mscloud
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 2
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 0
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  product-service:
    build: ./services/product-service
    container_name: product-service
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/product_db
      SPRING_DATASOURCE_USERNAME: mscloud
      SPRING_DATASOURCE_PASSWORD: mscloud
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 2
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 0
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build: ./services/order-service
    container_name: order-service
    environment:
      SERVER_PORT: 8080
      PRODUCT_SERVICE_URL: http://product-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      SPRING_DATASOURCE_USERNAME: mscloud
      SPRING_DATASOURCE_PASSWORD: mscloud
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 2
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 0
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_started
      notification-service:
        condition: service_started

  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: mscloud
      SPRING_DATASOURCE_PASSWORD: mscloud
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 2
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 0
    ports:
      - "8084:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
