name: CI

# TRIGGERS: Xác định các sự kiện vòng đời tự động kích hoạt workflow này.
on:
  # Kích hoạt khi có commit mới đẩy lên nhánh 'main' hoặc 'master'.
  push:
    branches:
      - main
      - master
  # Kích hoạt khi có yêu cầu hợp nhất mã (Pull Request) vào các nhánh chính.
  pull_request:

jobs:
  build:
    # ENVIRONMENT: Chỉ định môi trường máy chủ ảo chạy hệ điều hành Ubuntu mới nhất.
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Tải toàn bộ mã nguồn từ kho lưu trữ về máy ảo để xử lý.
      - name: Checkout
        uses: actions/checkout@v4

      # Bước 2: Thiết lập môi trường Java (JDK 17) phục vụ quá trình biên dịch.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # Tối ưu hóa hiệu năng bằng cơ chế lưu đệm (cache) cho các thư viện Maven.
          cache: maven

      # Bước 3: Kích hoạt công cụ Maven để biên dịch mã nguồn và chạy toàn bộ Unit Tests.
      - name: Build and test
        run: mvn test
