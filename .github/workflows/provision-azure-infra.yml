name: Provision Azure Infrastructure

# TRIGGERS: Yêu cầu kích hoạt thủ công, nhằm đảm bảo quy trình thay đổi kiến trúc hạ tầng đám mây 
# phải được kiểm soát nghiêm ngặt bởi người có thẩm quyền, ngăn ngừa các gián đoạn không mong muốn.
on:
  workflow_dispatch:

# Đảm bảo các luồng thực thi không bị chồng chéo, hủy luồng đang chạy nếu có luồng mới.
concurrency:
  group: azure-infra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    # Trỏ định danh môi trường để lấy các biến số cấu hình bảo mật.
    environment: dev

    steps:
      # Bước 1: Tải toàn bộ mã nguồn chứa kịch bản Infrastructure as Code.
      - name: Checkout
        uses: actions/checkout@v4

      # Bước 2: AZURE AUTHENTICATION. Dùng thông tin định danh cấp phát cho Service Principal 
      # (từ GitHub Secrets) để xác thực và ủy quyền trên nền tảng Azure.
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Bước 3: CONFIGURATION GENERATION. Đọc các biến số môi trường (Variables) theo ngữ cảnh 'dev',
      # tự động sinh tệp cấu hình trung gian (env.ps1) theo định dạng PowerShell.
      - name: Generate Azure env config
        shell: pwsh
        run: |
          @"
          `$ProjectName = "${{ vars.PROJECT_NAME }}"
          `$EnvironmentName = "${{ vars.ENVIRONMENT_NAME }}"
          `$Location = "${{ vars.AZURE_LOCATION }}"
          `$ResourceGroup = "${{ vars.AZURE_RESOURCE_GROUP }}"
          `$ContainerAppsEnv = "${{ vars.AZURE_CONTAINER_APPS_ENV }}"
          `$LogAnalyticsWorkspace = "${{ vars.AZURE_LOG_ANALYTICS_WORKSPACE }}"
          `$UserAssignedIdentity = "${{ vars.AZURE_USER_ASSIGNED_IDENTITY }}"
          `$AcrName = "${{ vars.AZURE_CONTAINER_REGISTRY }}"
          `$PostgresServerName = "${{ vars.AZURE_POSTGRES_SERVER }}"
          `$PostgresAdminUser = "${{ vars.AZURE_POSTGRES_ADMIN_USER }}"
          `$PostgresAdminPassword = "${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}"
          `$PostgresSku = "${{ vars.AZURE_POSTGRES_SKU }}"
          `$PostgresTier = "${{ vars.AZURE_POSTGRES_TIER }}"
          `$PostgresVersion = "${{ vars.AZURE_POSTGRES_VERSION }}"
          `$ImageTag = "infra"
          `$Services = @("user-service", "product-service", "notification-service", "order-service", "gateway-service")
          "@ | Set-Content -Path infra/azure/env.ps1 -Encoding UTF8

      # Bước 4: RESOURCE PROVISIONING. Kích hoạt module PowerShell cốt lõi (create-infra.ps1). 
      # Script này sẽ phân giải các lệnh Azure CLI nhằm xây dựng kiến trúc tài nguyên theo cấu hình đã định nghĩa.
      - name: Create or update Azure infrastructure
        shell: pwsh
        run: ./infra/azure/create-infra.ps1
