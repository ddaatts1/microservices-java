# ==============================================================================
# QUY TRÌNH TỰ ĐỘNG KHỞI TẠO HẠ TẦNG (INFRASTRUCTURE AS CODE)
# Tác dụng: Chỉ cần 1 click, kịch bản này sẽ tự động tạo toàn bộ "đất đai" trên Azure 
# (Database, Container Apps Environment, Registry, Log Analytics...) 
# thay vì phải lên giao diện web Azure click bằng tay từng dịch vụ một.
# ==============================================================================
name: Provision Azure Infrastructure

# workflow_dispatch nghĩa là workflow này không chạy tự động khi push code, 
# mà chỉ chạy khi có người quản trị bấm nút "Run workflow" bằng tay.
on:
  workflow_dispatch:

concurrency:
  group: azure-infra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: dev # Lấy các biến môi trường (Variables) ở mục 'dev' trong repo settings

    steps:
      # Bước 1: Tải code chứa kịch bản tạo hạ tầng về
      - name: Checkout
        uses: actions/checkout@v4

      # Bước 2: Đăng nhập vào Azure bằng tài khoản dịch vụ (Service Principal)
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Bước 3: Tạo một file cấu hình môi trường (env.ps1) 
      # bằng cách đọc các biến từ GitHub (vars.xxx) và điền vào file.
      # File này sẽ được dùng cho các script PowerShell ở bước sau.
      - name: Generate Azure env config
        shell: pwsh
        run: |
          @"
          `$ProjectName = "${{ vars.PROJECT_NAME }}"
          `$EnvironmentName = "${{ vars.ENVIRONMENT_NAME }}"
          `$Location = "${{ vars.AZURE_LOCATION }}"
          `$ResourceGroup = "${{ vars.AZURE_RESOURCE_GROUP }}"
          `$ContainerAppsEnv = "${{ vars.AZURE_CONTAINER_APPS_ENV }}"
          `$LogAnalyticsWorkspace = "${{ vars.AZURE_LOG_ANALYTICS_WORKSPACE }}"
          `$UserAssignedIdentity = "${{ vars.AZURE_USER_ASSIGNED_IDENTITY }}"
          `$AcrName = "${{ vars.AZURE_CONTAINER_REGISTRY }}"
          `$PostgresServerName = "${{ vars.AZURE_POSTGRES_SERVER }}"
          `$PostgresAdminUser = "${{ vars.AZURE_POSTGRES_ADMIN_USER }}"
          `$PostgresAdminPassword = "${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}"
          `$PostgresSku = "${{ vars.AZURE_POSTGRES_SKU }}"
          `$PostgresTier = "${{ vars.AZURE_POSTGRES_TIER }}"
          `$PostgresVersion = "${{ vars.AZURE_POSTGRES_VERSION }}"
          `$ImageTag = "infra"
          `$Services = @("user-service", "product-service", "notification-service", "order-service", "gateway-service")
          "@ | Set-Content -Path infra/azure/env.ps1 -Encoding UTF8

      # Bước 4: Chạy script PowerShell để ra lệnh cho Azure tạo tài nguyên.
      # Script này nằm ở thư mục infra/azure/create-infra.ps1
      - name: Create or update Azure infrastructure
        shell: pwsh
        run: ./infra/azure/create-infra.ps1
