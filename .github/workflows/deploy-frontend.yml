# ==============================================================================
# WORKFLOW: FRONTEND DEPLOYMENT TO AZURE STATIC WEB APPS
# 
# DESCRIPTION:
# Đảm nhiệm việc triển khai phân hệ Frontend (SPA/Static Files) lên hạ tầng 
# Azure Static Web Apps (ASWA). Quy trình sử dụng Action chuẩn hóa của nền tảng 
# Azure để đồng bộ hóa mã nguồn tĩnh một cách liền mạch.
#
# TRIGGERS:
# - push: Chỉ kích hoạt khi mã nguồn trong thư mục 'frontend/**' có sự thay đổi 
#         trên nhánh 'main'. Thiết lập này giúp tránh trigger không cần thiết 
#         khi lập trình viên chỉ cập nhật mã nguồn ở phân hệ Backend.
# - workflow_dispatch: Cho phép quản trị viên kích hoạt thủ công từ giao diện GitHub.
#
# SECURITY & AUTHENTICATION:
# - AZURE_STATIC_WEB_APPS_API_TOKEN: Khóa API cấp quyền triển khai (Deployment Token) 
#   được lưu trữ an toàn trong GitHub Secrets, đảm bảo xác thực quyền truy cập ghi 
#   (write access) lên tài nguyên ASWA đích.
#
# EXECUTION BEHAVIOR:
# - skip_app_build: Được cấu hình 'true' vì frontend trong dự án là tệp HTML/JS tĩnh 
#   nguyên bản (Vanilla), không yêu cầu quy trình biên dịch (như Webpack, Vite). 
#   Mã nguồn sẽ được phân phối trực tiếp lên Global CDN.
# ==============================================================================
name: Deploy Frontend to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/frontend" 
          api_location: ""
          output_location: "" 
          skip_app_build: true
