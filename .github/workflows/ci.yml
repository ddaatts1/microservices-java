# ==============================================================================
# WORKFLOW: CONTINUOUS INTEGRATION (CI)
# 
# DESCRIPTION:
# Quy trình Tích hợp Liên tục (CI) đảm bảo tính toàn vẹn của mã nguồn. 
# Workflow này tự động kích hoạt quá trình biên dịch (build) và kiểm thử (test) 
# cho các ứng dụng Java/Spring Boot sử dụng công cụ quản lý vòng đời Maven.
#
# TRIGGERS:
# - push: Kích hoạt khi có commit mới đẩy lên nhánh 'main' hoặc 'master'.
# - pull_request: Kích hoạt khi có yêu cầu hợp nhất mã (PR) vào các nhánh chính.
#
# ENVIRONMENT:
# - OS: Ubuntu Latest
# - Java JDK: Version 17 (Temurin distribution) với cơ chế lưu trữ đệm (maven cache)
#   nhằm tối ưu hóa thời gian tải thư viện dependency trong các lần chạy kế tiếp.
# ==============================================================================
name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: mvn test
